name: BUILD TEST

on:
  pull_request:
    branches: [main]
    paths:
      - 'Projects/**'
      - 'Tuist/**'
      - 'Tuist.swift'
      - 'Project.swift'
      - 'Workspace.swift'
      - 'mise.toml'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Install Mise
        uses: jdx/mise-action@v5

      - name: Cache Tuist dependencies
        uses: actions/cache@v6
        with:
          path: |
            Tuist/.build
            ~/.cache/swifterpm
            ~/.cache/tuist
          key: tuist-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tuist/Package.resolved') }}

      - name: Log in Tuist
        run: |
          tuist auth login

      - name: Install Dependencies
        run: |
          tuist install

      - name: Setup Tuist cache
        run: |
          tuist setup cache

      - name: Generate Xcode Project
        run: |
          tuist generate --no-open

      - name: Build and test
        run: |
          tuist test
